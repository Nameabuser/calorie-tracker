function offMap(p){var n=p.nutriments||{},perServing=finite(n['energy-kcal_serving'])&&n['energy-kcal_serving']>0,k=perServing?n['energy-kcal_serving']:n['energy-kcal_100g'];if(!finite(k)||k<=0)return {err:'no-kcal',name:p.product_name||'product'};var sfx=perServing?'':' (per 100g)';var name=((p.brands?String(p.brands).split(',')[0].trim()+' ':'')+(p.product_name||'Packaged food')).trim();var size=perServing?(p.serving_size||'1 serving'):'100g';var gk=s=>finite(s)?Math.round(s*10)/10:0;var mac={p:gk(perServing?(n.proteins_serving!==undefined?n.proteins_serving:n.proteins_100g):n.proteins_100g),c:gk(perServing?(n.carbohydrates_serving!==undefined?n.carbohydrates_serving:n.carbohydrates_100g):n.carbohydrates_100g),f:gk(perServing?(n.fat_serving!==undefined?n.fat_serving:n.fat_100g):n.fat_100g)};return {name:name.slice(0,80),k:Math.round(k),mac:mac,label:(name+' ('+size+')'+sfx).slice(0,100)}}
async function lookupBarcode(){var bcEl=document.getElementById('bc');if(!bcEl)return;var code=(bcEl.value||'').replace(/\D/g,'');if(code.length<8){alert('Enter the full barcode number (8-14 digits)');return}

function ringSVG(pct,color){var C=2*Math.PI*34,pc=Math.max(0,Math.min(1,pct||0)),off=C*(1-pc);return '<svg width=84 height=84 viewBox="0 0 84 84" role="img"><circle cx=42 cy=42 r=34 fill=none stroke="var(--in)" stroke-width=9></circle><circle cx=42 cy=42 r=34 fill=none stroke="'+color+'" stroke-width=9 stroke-linecap=round stroke-dasharray="'+C.toFixed(1)+'" stroke-dashoffset="'+off.toFixed(1)+'" transform="rotate(-90 42 42)"></circle><text x=42 y=47 text-anchor=middle fill="var(--tx)" font-size=15 font-weight=700>'+Math.round((pct||0)*100)+'%</text></svg>'}

function download(){var b=new Blob([JSON.stringify(D,null,2)],{type:'application/json'}),url=URL.createObjectURL(b),a=document.createElement('a');a.href=url;a.download='calories-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function bk(){var s=JSON.stringify(D);if(navigator.clipboard)navigator.clipboard.writeText(s).then(()=>notify('Backup copied'),()=>prompt('Copy backup',s));else prompt('Copy backup',s)}
