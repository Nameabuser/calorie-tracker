function render(t){document.open();document.write(t.slice(0,3).join("").replace("</body>",function(){return "<script>"+t[3]+"<\/script><script>"+t[4]+"<\/script><script>"+t[5]+"<\/script></body>"}));document.close()}

function store(c,t){return Promise.all(urls.map(function(u,i){return c.put("./"+u,new Response(t[i]))})).then(function(){return c.keys()}).then(function(ks){return Promise.all(ks.filter(function(k){return urls.every(function(u){return !k.url.endsWith("/"+u)})}).map(function(k){return c.delete(k)}))})}
function same(a,b){return a.every(function(x,i){return x===b[i]})}
function cold(){return net().then(function(t){render(t);try{if(window.caches)caches.open(CN).then(function(c){return store(c,t)}).catch(function(){})}catch(e){}}).catch(fail)}
if(!window.caches){cold();return}
caches.open(CN).then(function(c){return Promise.all(urls.map(function(u){return c.match("./"+u)})).then(function(ms){
if(!ms.every(Boolean))return cold();

net().then(function(t){if(same(t,old))return;return store(c,t).then(function(){var a=document.activeElement,o=document.getElementById("sp-ov");if((a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))||o||document.getElementById("ed-ov"))return;location.reload()})}).catch(function(){})
