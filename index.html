function download(){var b=new Blob([JSON.stringify(D,null,2)],{type:'application/json'}),url=URL.createObjectURL(b),a=document.createElement('a');a.href=url;a.download='calories-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function bk(){var s=JSON.stringify(D);if(navigator.clipboard)navigator.clipboard.writeText(s).then(()=>notify('Backup copied'),()=>prompt('Copy backup',s));else prompt('Copy backup',s)}
function restore(s){try{var j=JSON.parse(s);if(!ok(j))throw 1;j=withoutWeight(j);if(!confirm('Replace all current food, favourites and saved meals with this backup?'))return;try{localStorage.setItem('cal',JSON.stringify(j))}catch(e){alert('Could not save backup. Current data was not changed.');return}D=j;lastSaved=JSON.stringify(j);loadFailed=false;R();notify('Backup restored')}catch(e){alert('Invalid backup. Current data was not changed.')}}
function rs(){var s=prompt('Paste backup');if(s)restore(s)}
function restoreFile(el){var f=el.files[0];if(!f)return;if(f.size>5000000){alert('Backup too large (max 5 MB)');return}var r=new FileReader();r.onload=()=>restore(r.result);r.onerror=()=>alert('Could not read backup');r.readAsText(f)}
