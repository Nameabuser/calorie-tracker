<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black"><meta name="apple-mobile-web-app-title" content="Calories"><meta name="theme-color" content="#0a120d"><link rel="apple-touch-icon" href="3-apple-touch-icon.png"><link rel="icon" type="image/png" href="4-icon-192.png"><link rel="manifest" href="manifest.webmanifest"><title>Calories</title>
<style>:root{--bg:#0a120d;--tx:#f5f5f5;--cd:#14201a;--in:#22332a;--nv:#0a120d;--mu:#a8a8a8;--bd:#22332a}[data-t=light]{--bg:#f2f4f8;--tx:#111827;--cd:#fff;--in:#e6e9f2;--nv:#fff;--mu:#667085;--bd:#e3e6ee}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px -apple-system,sans-serif;padding:env(safe-area-inset-top) 14px calc(90px + env(safe-area-inset-bottom))}h2{margin:16px 0 8px}.c{background:var(--cd);border-radius:14px;padding:12px;margin:10px 0}input,select,button{width:100%;padding:12px;margin:4px 0;border-radius:10px;border:0;background:var(--in);color:var(--tx);font-size:16px}button{background:#ff8a1f;color:#111;font-weight:600}.r{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--bd)}.g{color:#22c55e}.b{color:#ef4444}small{color:var(--mu)}.x{background:none;width:auto;padding:4px 8px;color:var(--mu)}.n{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--nv);padding:8px 8px calc(8px + env(safe-area-inset-bottom)/2)}.n button{background:none;color:var(--mu);font-size:14px}.n .a{color:var(--tx)}.big{font-size:28px;font-weight:700}.ch{width:auto;display:inline-block;margin:3px;padding:8px 14px;background:var(--in);color:var(--tx);font-weight:500}.th{width:auto;float:right;padding:6px 14px;margin-top:14px;background:var(--in);color:var(--tx)}.th+h2+.c{clear:both}.bar{height:14px;background:var(--in);border-radius:8px;overflow:hidden;margin:10px 0}.bar i{display:block;height:100%;background:#22c55e}.bar i.o{background:#ef4444}.f{display:flex;gap:8px}.f>*{flex:1;min-width:0}::-webkit-scrollbar{display:none;width:0;height:0}html{scrollbar-width:none}body{max-width:650px;margin:auto}.n{max-width:650px;margin:auto}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.metrics>div{background:var(--in);border-radius:10px;padding:10px;text-align:center}.metrics strong{display:block;font-size:20px}.muted{color:var(--mu)}label{display:block;color:var(--mu);font-size:13px;margin:8px 0 2px}.chart{display:flex;align-items:flex-end;gap:7px;height:155px;padding-top:24px}.col{flex:1;min-width:0;text-align:center}.col i{display:block;background:#22c55e;min-height:3px;border-radius:6px 6px 0 0;margin-top:4px}.col small{font-size:11px;display:block;padding-top:6px}.col b{font-size:10px;font-weight:400}.r>span{min-width:0;overflow-wrap:anywhere;padding-right:8px}.r button{flex-shrink:0}.note{font-size:12px;line-height:1.5}.active{outline:2px solid #ff8a1f}.toast{position:fixed;bottom:86px;left:50%;transform:translateX(-50%);background:#ff8a1f;color:#111;padding:10px 18px;border-radius:12px;z-index:10;max-width:90%;text-align:center}input[type=checkbox]{width:auto}.f button{padding:10px}.mealhead{font-size:14px;color:var(--mu);margin:14px 0 3px}h3{margin:6px 0 12px;font-size:17px}.star{color:#ff8a1f}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #22c55e}button{cursor:pointer}input[type=date]{min-height:44px} .n{border-top:1px solid var(--bd)}
</style></head><body><div id="app"></div><nav class="n" aria-label="Main"><button onclick="go(0)" id="n0">Today</button><button onclick="go(1)" id="n1">Add</button><button onclick="go(2)" id="n2">History</button><button onclick="go(3)" id="n3">More</button></nav><div id="toast" role="status"></div><script>
var FOODS=[["Roti / chapati (1)",100],["Plain paratha (1)",260],["Aloo paratha (1)",300],["Naan (1)",260],["Steamed rice (1 bowl)",200],["Jeera rice (1 bowl)",230],["Dal (1 bowl)",150],["Rajma (1 bowl)",210],["Chole (1 bowl)",240],["Paneer curry (1 bowl)",320],["Palak paneer (1 bowl)",280],["Mixed veg (1 bowl)",130],["Aloo sabzi (1 bowl)",160],["Chicken curry (1 bowl)",300],["Egg (boiled, 1)",78],["Omelette (2 eggs)",190],["Idli (1)",40],["Dosa plain (1)",130],["Masala dosa (1)",250],["Sambar (1 bowl)",100],["Upma (1 bowl)",200],["Poha (1 plate)",250],["Samosa (1)",260],["Pakora (4 pcs)",200],["Chole bhature (1 plate)",450],["Pav bhaji (1 plate)",400],["Vada pav (1)",290],["Veg biryani (1 plate)",350],["Chicken biryani (1 plate)",450],["Maggi (1 pack)",350],["Curd / dahi (1 bowl)",100],["Lassi (1 glass)",180],["Chaas (1 glass)",50],["Chai with sugar (1 cup)",70],["Milk (1 glass)",150],["Banana (1)",105],["Apple (1)",95],["Gulab jamun (1)",150],["Jalebi (50g)",180],["Rasgulla (1)",130],["Ladoo (1)",190],["Biscuits (2)",90],["Bread slice (1)",70],["Peanut butter (1 tbsp)",95],["Momos (6 pcs)",250],["Pizza slice (1)",285],["Burger (1)",350],["French fries (medium)",365],["Cold drink (1 can)",140]];
// v2: additive schema. Existing meals and goal remain in the same cal key.
var D={m:[],g:2000},loadFailed=false,P=0,T='dark',Q='',filter='all',lastSaved='',MEALS=['Breakfast','Lunch','Dinner','Snack','Unsorted'];
function finite(v){return typeof v==='number'&&Number.isFinite(v)}
function validDate(s){return typeof s==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(s)&&new Date(s+'T12:00:00Z').toISOString().slice(0,10)===s}
function ok(x){try{return x&&typeof x==='object'&&Array.isArray(x.m)&&finite(x.g)&&x.g>0&&x.m.every(v=>v&&finite(v.i)&&typeof v.n==='string'&&finite(v.k)&&v.k>=0&&validDate(v.d)&&(!v.mac||['p','c','f'].every(k=>finite(v.mac[k])&&v.mac[k]>=0))&&(!v.meal||MEALS.includes(v.meal)))&&(!x.water||Array.isArray(x.water)&&x.water.every(v=>v&&validDate(v.d)&&finite(v.ml)&&v.ml>=0))&&(!x.weights||Array.isArray(x.weights)&&x.weights.every(v=>v&&validDate(v.d)&&finite(v.kg)&&v.kg>0))&&(!x.fav||Array.isArray(x.fav)&&x.fav.every(v=>Number.isInteger(v)&&v>=0&&v<FOODS.length))&&(x.wg===undefined||finite(x.wg)&&x.wg>0)}catch(e){return false}}
try{var raw=localStorage.getItem('cal');if(raw!==null){var j=JSON.parse(raw);if(!ok(j))throw 1;D=j}lastSaved=JSON.stringify(D);T=localStorage.getItem('calt')||'dark'}catch(e){loadFailed=true;alert('Saved data could not be loaded. It has not been changed. Restore a valid backup to continue.')}
function today(d=new Date()){return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Kolkata',year:'numeric',month:'2-digit',day:'2-digit'}).format(d)}
function days(n){var d=new Date(today()+'T12:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function notify(s){var el=document.getElementById('toast');el.className='toast';el.textContent=s;clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>{el.textContent='';el.className=''},2200)}
function sv(){if(loadFailed){D=JSON.parse(lastSaved||'{"m":[],"g":2000}');alert('Saved data is protected. Restore a valid backup first.');R();return false}try{localStorage.setItem('cal',JSON.stringify(D));lastSaved=JSON.stringify(D);R();return true}catch(e){D=JSON.parse(lastSaved);R();alert('Could not save. Storage may be full or disabled. Your change was not saved.');return false}}
function go(p){P=p;R()}
function tg(){var t=T==='dark'?'light':'dark';try{localStorage.setItem('calt',t);T=t;R()}catch(e){alert('Could not save theme')}}
function tot(d){return D.m.filter(x=>x.d===d).reduce((a,x)=>a+x.k,0)}
function water(d){return (D.water||[]).filter(x=>x.d===d).reduce((a,x)=>a+x.ml,0)}
function macros(d){return D.m.filter(x=>x.d===d&&x.mac).reduce((a,x)=>{['p','c','f'].forEach(k=>a[k]+=x.mac[k]);return a},{p:0,c:0,f:0})}
function setG(){var v=prompt('Daily calorie goal (500-10000 kcal)',D.g);if(v===null)return;v=Math.round(Number(v));if(v>=500&&v<=10000){D.g=v;sv()}else alert('Enter 500-10000')}
function setWG(){var v=prompt('Water goal in ml (250-10000)',D.wg||2000);if(v===null)return;v=Math.round(Number(v));if(v>=250&&v<=10000){D.wg=v;sv()}else alert('Enter 250-10000')}
function logWater(ml){D.water=D.water||[];D.water.push({d:today(),ml:ml});if(sv())notify('Water saved')}
function undoWater(){var a=D.water||[];for(var i=a.length-1;i>=0;i--)if(a[i].d===today()){a.splice(i,1);break}sv()}
function fields(){return {d:document.getElementById('date').value,meal:document.getElementById('meal').value}}
function add(n,k,mac,fd){k=Math.round(Number(k));fd=fd||fields();if(!n.trim()||!(k>0)||k>10000||!validDate(fd.d)||fd.d>today()){alert('Enter a food name, 1-10000 calories and a date no later than today');return}if(mac&&!['p','c','f'].every(k=>finite(mac[k])&&mac[k]>=0&&mac[k]<=2000)){alert('Macros must be between 0 and 2000 g');return}var x={i:Date.now()+Math.random(),n:n.trim().slice(0,100),k:k,d:fd.d,meal:fd.meal};if(mac)x.mac=mac;D.m.push(x);P=0;if(sv())notify('Food saved')}
function addF(i){var q=Number(document.getElementById('q').value);if(!(q>0)||q>100){alert('Quantity must be above 0 and at most 100');return}add(FOODS[i][0]+(q!==1?' × '+q:''),FOODS[i][1]*q)}
function addC(){var ids=['mp','mc','mf'],vals=ids.map(id=>document.getElementById(id).value);if(vals.some(v=>v!=='')&&vals.some(v=>v==='')){alert('Enter all three macros, or leave all blank');return}add(document.getElementById('cn').value,document.getElementById('ck').value,vals.every(v=>v==='')?null:{p:Number(vals[0]),c:Number(vals[1]),f:Number(vals[2])})}
function repeat(i){var x=D.m.find(x=>x.i===i);if(x)add(x.n,x.k,x.mac,fields())}
function del(i){if(confirm('Delete this entry?')){D.m=D.m.filter(x=>x.i!==i);sv()}}
function fav(i){D.fav=D.fav||[];D.fav=D.fav.includes(i)?D.fav.filter(x=>x!==i):D.fav.concat(i);var inputs=['q','date','meal','cn','ck','mp','mc','mf'].map(id=>[id,document.getElementById(id).value]);sv();inputs.forEach(([id,v])=>{var e=document.getElementById(id);if(e)e.value=v})}
function sq(v){Q=v;renderFood()}
function setFilter(f){filter=f;renderFood();document.querySelectorAll('[data-filter]').forEach(b=>b.classList.toggle('active',b.dataset.filter===f))}
function renderFood(){var el=document.getElementById('foodlist');if(!el)return;var h='';FOODS.forEach((f,i)=>{if(f[0].toLowerCase().includes(Q.toLowerCase())&&(filter!=='fav'||(D.fav||[]).includes(i)))h+='<div class=r><span>'+esc(f[0])+'<br><small>'+f[1]+' kcal · approx.</small></span><div><button class="x star" aria-label="'+((D.fav||[]).includes(i)?'Unsave ':'Save ')+esc(f[0])+'" onclick="fav('+i+')">'+((D.fav||[]).includes(i)?'★':'☆')+'</button><button class="x star" onclick="addF('+i+')">Add</button></div></div>'});el.innerHTML=h||'<small>No foods found. Try Custom below.</small>'}
function weight(){var kg=Number(document.getElementById('kg').value),d=document.getElementById('wd').value;if(!(kg>=20&&kg<=500)||!validDate(d)||d>today()){alert('Enter 20-500 kg and a date no later than today');return}D.weights=D.weights||[];var existing=D.weights.find(x=>x.d===d);if(existing&&!confirm('Replace weight for '+d+'?'))return;D.weights=D.weights.filter(x=>x.d!==d);D.weights.push({d:d,kg:kg});if(sv())notify('Weight saved')}
function delW(d){if(confirm('Delete weight for '+d+'?')){D.weights=D.weights.filter(x=>x.d!==d);sv()}}
function streak(){var n=0,start=tot(today())>0?0:-1;for(var i=start;i>start-3660;i--){if(tot(days(i))<=0)break;n++}return n}
function R(){document.documentElement.setAttribute('data-t',T);var h='',now=today();for(var i=0;i<4;i++)document.getElementById('n'+i).className=i===P?'a':'';
if(P===0){var t=tot(now),left=D.g-t,pc=Math.min(100,t/D.g*100),mac=macros(now),list=D.m.filter(x=>x.d===now),known=list.filter(x=>x.mac).length;
h+='<button class=th onclick=tg()>'+(T==='dark'?'Light':'Dark')+' mode</button><h2>Today</h2><small>'+now+' · IST</small><div class=c><small>Eaten</small><div class="big '+(left<0?'b':'g')+'">'+t+' kcal</div><div class=bar><i class="'+(left<0?'o':'')+'" style="width:'+pc+'%"></i></div><div class=r style="border:0"><small>Goal '+D.g+'</small><small>'+(left>=0?left+' left':-left+' over')+'</small></div><button onclick=go(1)>+ Add food</button></div>';
h+='<div class=c><h3>Macros</h3><div class=metrics>'+[['p','Protein'],['c','Carbs'],['f','Fat']].map(a=>'<div><strong>'+Math.round(mac[a[0]]*10)/10+'g</strong><small>'+a[1]+'</small></div>').join('')+'</div><p class=note>'+known+' of '+list.length+' entries have macros. Add label values in Custom; unrecorded macros are not counted.</p></div>';
var w=water(now),wg=D.wg||2000;h+='<div class=c><h3>Water <small>'+w+' / '+wg+' ml</small></h3><div class=bar><i style="width:'+Math.min(100,w/wg*100)+'%"></i></div><div class=f><button onclick="logWater(250)">+250 ml</button><button onclick="logWater(500)">+500 ml</button><button class=x onclick=undoWater()>Undo</button></div></div><h2>Meals <small style="font-size:13px">'+streak()+' day logging streak</small></h2><div class=c>';
if(!list.length)h+='<small>Nothing logged yet. Tap Add.</small>';MEALS.forEach(m=>{var a=list.filter(x=>(x.meal||'Unsorted')===m);if(a.length){h+='<div class=mealhead>'+m+' · '+a.reduce((n,x)=>n+x.k,0)+' kcal</div>';a.forEach(x=>h+='<div class=r><span>'+esc(x.n)+'<br><small>'+x.k+' kcal</small></span><button class=x onclick="del('+x.i+')">Delete</button></div>')}});h+='</div>'}
if(P===1){h+='<h2>Add food</h2><div class=c><div class=f><div><label for=date>Date (IST)</label><input id=date type=date value="'+now+'" max="'+now+'"></div><div><label for=meal>Meal</label><select id=meal>'+MEALS.slice(0,4).map(m=>'<option>'+m+'</option>').join('')+'</select></div></div><label for=q>Quantity (list serving multiplier)</label><input id=q type=number inputmode=decimal value=1 min=0.1 step=0.1><label for=s>Search foods</label><input id=s placeholder="Search Indian food" value="'+esc(Q)+'" oninput="sq(this.value)"><div class=f><button class="ch '+(filter==='all'?'active':'')+'" data-filter=all onclick="setFilter(\'all\')">All foods</button><button class="ch '+(filter==='fav'?'active':'')+'" data-filter=fav onclick="setFilter(\'fav\')">Favourites</button></div></div>';
var recent=D.m.slice().reverse().filter((x,i,a)=>a.findIndex(y=>y.n===x.n)===i).slice(0,5);if(recent.length)h+='<div class=c><h3>Recent · add again</h3>'+recent.map(x=>'<div class=r><span>'+esc(x.n)+'<br><small>'+x.k+' kcal · same serving</small></span><button class="x star" onclick="repeat('+x.i+')">Add</button></div>').join('')+'</div>';
h+='<h2>Custom</h2><div class=c><label for=cn>Food name</label><input id=cn placeholder="Food name" maxlength=100><label for=ck>Calories for this serving</label><input id=ck type=number inputmode=numeric placeholder="Calories"><small>Optional macros for this serving (g)</small><div class=f>'+[['mp','Protein'],['mc','Carbs'],['mf','Fat']].map(a=>'<div><label for='+a[0]+'>'+a[1]+'</label><input id='+a[0]+' type=number inputmode=decimal min=0 step=0.1 placeholder="g"></div>').join('')+'</div><button onclick=addC()>Add custom</button></div><h2>Food list</h2><div class=c id=foodlist></div><p class=note>Food calories are rough averages. Portions, oil and recipes vary. For accurate macros, use the food label or your recipe.</p>'}
if(P===2){var dates=Array.from({length:7},(_,i)=>days(i-6)),vals=dates.map(tot),max=Math.max(D.g,...vals),sum=vals.reduce((a,b)=>a+b,0);h+='<h2>History</h2><div class=c><h3>Last 7 days</h3><small>'+sum+' kcal logged · '+Math.round(sum/7)+' per calendar day</small><div class=chart>'+dates.map((d,i)=>'<div class=col><b>'+vals[i]+'</b><i style="height:'+Math.round(vals[i]/max*100)+'px"></i><small>'+d.slice(5)+'</small></div>').join('')+'</div><p class=note>Blank days count as 0 logged calories, not 0 eaten.</p></div><div class=c>';
var ds=[...new Set(D.m.map(x=>x.d).concat((D.water||[]).map(x=>x.d)))].sort().reverse();if(!ds.length)h+='<small>No history yet.</small>';ds.forEach(d=>{h+='<details><summary class=r>'+d+' · '+tot(d)+' kcal</summary>';D.m.filter(x=>x.d===d).forEach(x=>h+='<div class=r><span>'+esc(x.n)+'<br><small>'+(x.meal||'Unsorted')+' · '+x.k+' kcal</small></span><button class=x onclick="del('+x.i+')">Delete</button></div>');h+='<p class=note>Water: '+water(d)+' ml</p></details>'});h+='</div><h2>Weight log</h2><div class=c><small>Optional personal log. No weight targets or diet advice.</small><div class=f><div><label for=wd>Date (IST)</label><input type=date id=wd value="'+now+'" max="'+now+'"></div><div><label for=kg>Weight (kg)</label><input id=kg type=number inputmode=decimal placeholder="kg" step=0.1></div></div><button onclick=weight()>Save weight</button>';
var ws=(D.weights||[]).slice().sort((a,b)=>b.d.localeCompare(a.d));if(ws.length>1){var diff=Math.round((ws[0].kg-ws[ws.length-1].kg)*10)/10;h+='<p class=note>Change since '+ws[ws.length-1].d+': '+(diff>0?'+':'')+diff+' kg</p>'}ws.forEach(x=>h+='<div class=r><span>'+x.d+' · '+x.kg+' kg</span><button class=x onclick="delW(\''+x.d+'\')">Delete</button></div>');h+='</div>'}
if(P===3){h+='<h2>More</h2><div class=c><h3>Your goals</h3><button onclick=setG()>Calorie goal · '+D.g+' kcal</button><button onclick=setWG()>Water goal · '+(D.wg||2000)+' ml</button><button class=ch onclick=tg()>'+(T==='dark'?'Light':'Dark')+' mode</button><p class=note>Goals are editable logging targets, not medical recommendations.</p></div><div class=c><h3>Keep your data safe</h3><button onclick=download()>Download backup</button><button onclick=bk()>Backup (copy)</button><button onclick=rs()>Restore from text</button><label for=restore>Or restore a backup file</label><input id=restore type=file accept=".json,application/json" onchange="restoreFile(this)"><p class=note>Stored only on this browser, not synced. Back up before clearing site data or changing phones. Old backups still work.</p></div><div class=c><h3>About</h3><p class=note>Calories v2 · Dates use India Standard Time. Food values are estimates. Macros count only values you enter. This is a personal log, not diet or medical advice.</p></div>'}
document.getElementById('app').innerHTML=h;if(P===1)renderFood()}
function download(){var b=new Blob([JSON.stringify(D,null,2)],{type:'application/json'}),url=URL.createObjectURL(b),a=document.createElement('a');a.href=url;a.download='calories-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function bk(){var s=JSON.stringify(D);if(navigator.clipboard)navigator.clipboard.writeText(s).then(()=>notify('Backup copied'),()=>prompt('Copy backup',s));else prompt('Copy backup',s)}
function restore(s){try{var j=JSON.parse(s);if(!ok(j))throw 1;if(!confirm('Replace all current food, water, weight and favourites with this backup?'))return;try{localStorage.setItem('cal',JSON.stringify(j))}catch(e){alert('Could not save backup. Current data was not changed.');return}D=j;lastSaved=JSON.stringify(j);loadFailed=false;R();notify('Backup restored')}catch(e){alert('Invalid backup. Current data was not changed.')}}
function rs(){var s=prompt('Paste backup');if(s)restore(s)}
function restoreFile(el){var f=el.files[0];if(!f)return;if(f.size>5000000){alert('Backup too large (max 5 MB)');return}var r=new FileReader();r.onload=()=>restore(r.result);r.onerror=()=>alert('Could not read backup');r.readAsText(f)}
R();
</script></body></html>
