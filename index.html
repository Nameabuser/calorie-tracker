<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black"><meta name="apple-mobile-web-app-title" content="Calories"><meta name="theme-color" content="#0a120d"><link rel="apple-touch-icon" href="3-apple-touch-icon.png"><link rel="icon" type="image/png" href="4-icon-192.png"><link rel="manifest" href="manifest.webmanifest"><title>Calories</title>
<style>:root{--bg:#0a120d;--tx:#f5f5f5;--cd:#14201a;--in:#22332a;--nv:#0a120d;--mu:#a8a8a8;--bd:#22332a}[data-t=light]{--bg:#f2f4f8;--tx:#111827;--cd:#fff;--in:#e6e9f2;--nv:#fff;--mu:#667085;--bd:#e3e6ee}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px -apple-system,sans-serif;padding:env(safe-area-inset-top) 14px calc(90px + env(safe-area-inset-bottom))}h2{margin:16px 0 8px}.c{background:var(--cd);border-radius:14px;padding:12px;margin:10px 0}input,select,button{width:100%;padding:12px;margin:4px 0;border-radius:10px;border:0;background:var(--in);color:var(--tx);font-size:16px}button{background:#ff8a1f;color:#111;font-weight:600}.r{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--bd)}.g{color:#22c55e}.b{color:#ef4444}small{color:var(--mu)}.x{background:none;width:auto;padding:4px 8px;color:var(--mu)}.n{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--nv);padding:8px 8px calc(8px + env(safe-area-inset-bottom)/2)}.n button{background:none;color:var(--mu);font-size:14px}.n .a{color:var(--tx)}.big{font-size:28px;font-weight:700}.ch{width:auto;display:inline-block;margin:3px;padding:8px 14px;background:var(--in);color:var(--tx);font-weight:500}.th{width:auto;float:right;padding:6px 14px;margin-top:14px;background:var(--in);color:var(--tx)}.th+h2+.c{clear:both}.bar{height:14px;background:var(--in);border-radius:8px;overflow:hidden;margin:10px 0}.bar i{display:block;height:100%;background:#22c55e}.bar i.o{background:#ef4444}.f{display:flex;gap:8px}.f>*{flex:1;min-width:0}::-webkit-scrollbar{display:none;width:0;height:0}html{scrollbar-width:none}</style></head><body><div id=app></div><div class=n><button onclick="go(0)" id=n0>Today</button><button onclick="go(1)" id=n1>Add</button><button onclick="go(2)" id=n2>History</button></div>
<script>
var FOODS=[["Roti / chapati (1)",100],["Plain paratha (1)",260],["Aloo paratha (1)",300],["Naan (1)",260],["Steamed rice (1 bowl)",200],["Jeera rice (1 bowl)",230],["Dal (1 bowl)",150],["Rajma (1 bowl)",210],["Chole (1 bowl)",240],["Paneer curry (1 bowl)",320],["Palak paneer (1 bowl)",280],["Mixed veg (1 bowl)",130],["Aloo sabzi (1 bowl)",160],["Chicken curry (1 bowl)",300],["Egg (boiled, 1)",78],["Omelette (2 eggs)",190],["Idli (1)",40],["Dosa plain (1)",130],["Masala dosa (1)",250],["Sambar (1 bowl)",100],["Upma (1 bowl)",200],["Poha (1 plate)",250],["Samosa (1)",260],["Pakora (4 pcs)",200],["Chole bhature (1 plate)",450],["Pav bhaji (1 plate)",400],["Vada pav (1)",290],["Veg biryani (1 plate)",350],["Chicken biryani (1 plate)",450],["Maggi (1 pack)",350],["Curd / dahi (1 bowl)",100],["Lassi (1 glass)",180],["Chaas (1 glass)",50],["Chai with sugar (1 cup)",70],["Milk (1 glass)",150],["Banana (1)",105],["Apple (1)",95],["Gulab jamun (1)",150],["Jalebi (50g)",180],["Rasgulla (1)",130],["Ladoo (1)",190],["Biscuits (2)",90],["Bread slice (1)",70],["Peanut butter (1 tbsp)",95],["Momos (6 pcs)",250],["Pizza slice (1)",285],["Burger (1)",350],["French fries (medium)",365],["Cold drink (1 can)",140]];
var D={m:[],g:2000},loadFailed=false,P=0,T='dark',Q='';
function ok(x){var o=v=>v!==null&&typeof v=='object';return o(x)&&Array.isArray(x.m)&&typeof x.g=='number'&&x.g>0&&x.m.every(v=>o(v)&&typeof v.i=='number'&&typeof v.n=='string'&&typeof v.k=='number'&&/^\d{4}-\d{2}-\d{2}$/.test(v.d))}
try{var s=localStorage.getItem('cal');if(s!==null){var j=JSON.parse(s);if(!ok(j))throw 1;D=j}T=localStorage.getItem('calt')||'dark'}catch(e){loadFailed=true;alert('Saved data could not be loaded. It has not been changed.')}
function sv(){if(loadFailed){alert('Saved data is protected.');return}localStorage.setItem('cal',JSON.stringify(D));R()}
function go(p){P=p;R()}
function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function today(d=new Date()){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function tg(){T=T=='dark'?'light':'dark';localStorage.setItem('calt',T);R()}
function tot(d){return D.m.filter(x=>x.d==d).reduce((a,x)=>a+x.k,0)}
function add(n,k){k=Math.round(Number(k));if(!n.trim()||!(k>0)||k>10000){alert('Enter a food name and calories (1-10000)');return}D.m.push({i:Date.now()+Math.random(),n:n.trim().slice(0,60),k:k,d:today()});P=0;sv()}
function addF(i){var q=Number(document.getElementById('q').value)||1;add(FOODS[i][0],FOODS[i][1]*q)}
function addC(){add(document.getElementById('cn').value,document.getElementById('ck').value)}
function del(i){if(confirm('Delete this entry?')){D.m=D.m.filter(x=>x.i!=i);sv()}}
function setG(){var v=Math.round(Number(prompt('Daily calorie goal',D.g)));if(v>=500&&v<=10000){D.g=v;sv()}else if(v)alert('Enter 500-10000')}
function sq(v){Q=v;R();var e=document.getElementById('s');if(e){e.focus();e.setSelectionRange(v.length,v.length)}}
function R(){document.documentElement.setAttribute('data-t',T);var h='',now=today();for(var i=0;i<3;i++)document.getElementById('n'+i).className=i==P?'a':'';
if(P==0){var t=tot(now),left=D.g-t,pc=Math.min(100,Math.round(t/D.g*100));
h+='<button class=th onclick=tg()>'+(T=='dark'?'Light':'Dark')+' mode</button><h2>Today</h2><div class=c><small>Eaten</small><div class="big '+(left<0?'b':'g')+'">'+t+' kcal</div><div class=bar><i class="'+(left<0?'o':'')+'" style="width:'+pc+'%"></i></div><div class=r style="border:0"><small>Goal '+D.g+'</small><small>'+(left>=0?left+' left':(-left)+' over')+'</small></div><button onclick=setG()>Change goal</button></div><h2>Meals</h2><div class=c>';
var L=D.m.filter(x=>x.d==now);if(!L.length)h+='<small>Nothing logged yet. Tap Add.</small>';L.forEach(x=>{h+='<div class=r><span>'+esc(x.n)+'<br><small>'+x.k+' kcal</small></span><button class=x onclick="del('+x.i+')">Delete</button></div>'});h+='</div>'}
if(P==1){h+='<h2>Add food</h2><div class=c><input id=s placeholder="Search Indian food" value="'+esc(Q)+'" oninput="sq(this.value)"><input id=q type=number inputmode=decimal value=1 min=0.5 step=0.5><small>Quantity (multiplies the list item)</small><div>';
FOODS.forEach((f,i)=>{if(f[0].toLowerCase().includes(Q.toLowerCase()))h+='<div class=r><span>'+esc(f[0])+'<br><small>'+f[1]+' kcal</small></span><button class=x style="color:#ff8a1f" onclick="addF('+i+')">Add</button></div>'});
h+='</div></div><h2>Custom</h2><div class=c><input id=cn placeholder="Food name"><input id=ck type=number inputmode=numeric placeholder="Calories"><button onclick=addC()>Add custom</button></div>'}
if(P==2){h+='<h2>History</h2><div class=c>';var ds=[...new Set(D.m.map(x=>x.d))].sort().reverse();if(!ds.length)h+='<small>No history yet.</small>';ds.forEach(d=>{var t=tot(d);h+='<div class=r><span>'+d+'</span><span class="'+(t>D.g?'b':'g')+'">'+t+' kcal</span></div>'});h+='</div><div class=c><button onclick=bk()>Backup (copy)</button><button onclick=rs()>Restore</button></div>'}
document.getElementById('app').innerHTML=h}
function bk(){var s=JSON.stringify(D);if(navigator.clipboard)navigator.clipboard.writeText(s).then(()=>alert('Backup copied'),()=>prompt('Copy backup',s));else prompt('Copy backup',s)}
function rs(){var s=prompt('Paste backup');if(!s)return;try{var j=JSON.parse(s);if(!ok(j))throw 1;if(confirm('Replace current data?')){D=j;loadFailed=false;sv()}}catch(e){alert('Invalid backup')}}
R();
</script></body></html>
