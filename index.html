    <style>
      :root {
        --bg: #0a120d;
        --tx: #f5f5f5;
        --cd: #14201a;
        --in: #22332a;
        --nv: #0a120d;
        --mu: #a8a8a8;
        --bd: #22332a;
      }
      [data-t="light"] {
        --bg: #f2f4f8;
        --tx: #111827;
        --cd: #fff;
        --in: #e6e9f2;
        --nv: #fff;
        --mu: #667085;
        --bd: #e3e6ee;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--tx);
        font:
          16px -apple-system,
          sans-serif;
        padding: env(safe-area-inset-top) 14px
          calc(90px + env(safe-area-inset-bottom));
      }
      h2 {
        margin: 16px 0 8px;
      }
      .c {
        background: var(--cd);
        border-radius: 14px;
        padding: 12px;
        margin: 10px 0;
      }
      input,
      select,
      button {
        width: 100%;
        padding: 12px;
        margin: 4px 0;
        border-radius: 10px;
        border: 0;
        background: var(--in);
        color: var(--tx);
        font-size: 16px;
      }
      button {
        background: #ff8a1f;
        color: #111;
        font-weight: 600;
      }
      .r {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 8px 0;
        border-bottom: 1px solid var(--bd);
      }
      .g {
        color: #22c55e;
      }
      .b {
        color: #ef4444;
      }
      small {
        color: var(--mu);
      }
      .x {
        background: none;
        width: auto;
        padding: 4px 8px;
        color: var(--mu);
      }
      .n {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        display: flex;
        background: var(--nv);
        padding: 8px 8px calc(8px + env(safe-area-inset-bottom) / 2);
      }
      .n button {
        background: none;
        color: var(--mu);
        font-size: 14px;
      }
      .n .a {
        color: var(--tx);
      }
      .big {
        font-size: 28px;
        font-weight: 700;
      }
      .ch {
        width: auto;
        display: inline-block;
        margin: 3px;
        padding: 8px 14px;
        background: var(--in);
        color: var(--tx);
        font-weight: 500;
      }
      .th {
        width: auto;
        float: right;
        padding: 6px 14px;
        margin-top: 14px;
        background: var(--in);
        color: var(--tx);
      }
      .th + h2 + .c {
        clear: both;
      }
      .bar {
        height: 14px;
        background: var(--in);
        border-radius: 8px;
        overflow: hidden;
        margin: 10px 0;
      }
      .bar i {
        display: block;
        height: 100%;
        background: #22c55e;
      }
      .bar i.o {
        background: #ef4444;
      }
      .f {
        display: flex;
        gap: 8px;
      }
      .f > * {
        flex: 1;
        min-width: 0;
      }
      ::-webkit-scrollbar {
        display: none;
        width: 0;
        height: 0;
      }
      html {
        scrollbar-width: none;
      }
      body {
        max-width: 650px;
        margin: auto;
      }
      .n {
        max-width: 650px;
        margin: auto;
      }
      .metrics {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
      }
      .metrics > div {
        background: var(--in);
        border-radius: 10px;
        padding: 10px;
        text-align: center;
      }
      .metrics strong {
        display: block;
        font-size: 20px;
      }
      .muted {
        color: var(--mu);
      }
      label {
        display: block;
        color: var(--mu);
        font-size: 13px;
        margin: 8px 0 2px;
      }
      .chart {
        display: flex;
        align-items: flex-end;
        gap: 7px;
        height: 155px;
        padding-top: 24px;
      }
      .col {
        flex: 1;
        min-width: 0;
        text-align: center;
      }
      .col i {
        display: block;
        background: #22c55e;
        min-height: 3px;
        border-radius: 6px 6px 0 0;
        margin-top: 4px;
      }
      .col small {
        font-size: 11px;
        display: block;
        padding-top: 6px;
      }
      .col b {
        font-size: 10px;
        font-weight: 400;
      }
      .r > span {
        min-width: 0;
        overflow-wrap: anywhere;
        padding-right: 8px;
      }
      .r button {
        flex-shrink: 0;
      }
      .note {
        font-size: 12px;
        line-height: 1.5;
      }
      .active {
        outline: 2px solid #ff8a1f;
      }
      .toast {
        position: fixed;
        bottom: 86px;
        left: 50%;
        transform: translateX(-50%);
        background: #ff8a1f;
        color: #111;
        padding: 10px 18px;
        border-radius: 12px;
        z-index: 10;
        max-width: 90%;
        text-align: center;
      }
      input[type="checkbox"] {
        width: auto;
      }
      .f button {
        padding: 10px;
      }
      .mealhead {
        font-size: 14px;
        color: var(--mu);
        margin: 14px 0 3px;
      }
      h3 {
        margin: 6px 0 12px;
        font-size: 17px;
      }
      .star {
        color: #ff8a1f;
      }
      button:focus-visible,
      input:focus-visible,
      select:focus-visible {
        outline: 2px solid #22c55e;
      }
      button {
        cursor: pointer;
      }
      input[type="date"] {
        min-height: 44px;
      }
      .n {
        border-top: 1px solid var(--bd);
      }
      .addbar {
        position: sticky;
        top: 0;
        z-index: 3;
        background: var(--bg);
        padding: 8px 0;
        border-bottom: 1px solid var(--bd);
      }
      .addbar .f button {
        background: var(--in);
        color: var(--tx);
        min-height: 44px;
      }
      .addbar .f button.active {
        background: #ff8a1f;
        color: #111;
        outline: 0;
      }
      summary {
        cursor: pointer;
        min-height: 44px;
        display: flex;
        align-items: center;
        font-size: 14px;
      }
      .r .x {
        min-height: 44px;
        min-width: 44px;
      }
      .n {
        z-index: 5;
      }
      [hidden] {
        display: none !important;
      }
      .mealhead {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 6px;
      }
      .mealhead span {
        min-width: 0;
      }
      .savedactions {
        display: flex;
        flex-direction: column;
        flex-shrink: 0;
      }
      .addbar .f button {
        font-size: 14px;
        padding: 10px 5px;
      }
      .r > span {min-width:0;overflow-wrap:anywhere;}
      .r > div {flex-shrink:0;}
      .r small {display:block;line-height:1.5;}
      textarea {width:100%;min-height:120px;background:var(--in);color:var(--tx);border:0;border-radius:10px;padding:12px;font:inherit;}
      a {color:#ff8a1f;}
      .note {overflow-wrap:anywhere;}
      .note a {
        color: #ff8a1f;
      }

      function chooseUSDA(i) {var x=liveResults[i];if(x) {openReview(x);document.getElementById('rq').value=100;calcReview();}}

      function ringSVG(pct, color) {
        var C = 2 * Math.PI * 34,
          pc = Math.max(0, Math.min(1, pct || 0)),
          off = C * (1 - pc);
        return (
          '<svg width=84 height=84 viewBox="0 0 84 84" role="img"><circle cx=42 cy=42 r=34 fill=none stroke="var(--in)" stroke-width=9></circle><circle cx=42 cy=42 r=34 fill=none stroke="' +
          color +
          '" stroke-width=9 stroke-linecap=round stroke-dasharray="' +
          C.toFixed(1) +
          '" stroke-dashoffset="' +
          off.toFixed(1) +
          '" transform="rotate(-90 42 42)"></circle><text x=42 y=47 text-anchor=middle fill="var(--tx)" font-size=15 font-weight=700>' +
          Math.round((pct || 0) * 100) +
          "%</text></svg>"
        );
      }
      function streak() {
        var n = 0,
          start = tot(today()) > 0 ? 0 : -1;
        for (var i = start; i > start - 3660; i--) {
          if (tot(days(i)) <= 0) break;
          n++;
        }
        return n;
      }
      function R() {
        if (scanning || scanStarting) stopScan();
        document.documentElement.setAttribute("data-t", T);
        var h = "",
          now = today();
        for (var i = 0; i < 4; i++)
          document.getElementById("n" + i).className = i === P ? "a" : "";
        if (P === 0) {
          var t = tot(now),
            left = D.g - t,
            pc = Math.min(100, (t / D.g) * 100),
            mac = macros(now),
            list = D.m.filter((x) => x.d === now),
            known = list.filter((x) => x.mac).length;
          h +=
            "<button class=th onclick=tg()>" +
            (T === "dark" ? "Light" : "Dark") +
            " mode</button><h2>Today</h2><small>" +
            now +
            ' · IST</small><div class=c><small>Eaten</small><div class="big ' +
            (left < 0 ? "b" : "g") +
            '">' +
            t +
            ' kcal</div><div class=bar><i class="' +
            (left < 0 ? "o" : "") +
            '" style="width:' +
            pc +
            '%"></i></div><div class=r style="border:0"><small>Goal ' +
            D.g +
            "</small><small>" +
            (left >= 0 ? left + " left" : -left + " over") +
            "</small></div><button onclick=go(1)>+ Add food</button></div>";
          var pg = D.pg || 60;
          h +=
            '<div class=c><h3>Goal rings</h3><div class=f style="text-align:center"><div><small>Calories</small><br>' +
            ringSVG(t / D.g, "#22c55e") +
            "<br><small>" +
            t +
            " / " +
            D.g +
            " kcal</small></div><div><small>Protein</small><br>" +
            ringSVG(mac.p / pg, "#ff8a1f") +
            "<br><small>" +
            Math.round(mac.p) +
            " / " +
            pg +
            " g</small></div></div><p class=note>Protein counts recorded macros only. Preset recipes, USDA and label entries have macros; unknown values are not treated as zero.</p></div>";
          var recentT = D.m
            .slice()
            .reverse()
            .filter((x, i, a) => a.findIndex((y) => y.n === x.n) === i)
            .slice(0, 5);
          if (recentT.length)
            h +=
              '<div class=c><h3>Quick add · recent</h3><div class=f style="flex-wrap:wrap">' +
              recentT
                .map(
                  (x) =>
                    '<button class=ch style="flex:0 1 auto;min-height:44px" onclick="quickAdd(\'' +
                    x.i +
                    '\')" aria-label="Add ' +
                    esc(x.n) +
                    ' again">' +
                    esc(x.n.length > 22 ? x.n.slice(0, 21) + "…" : x.n) +
                    " · " +
                    x.k +
                    "</button>",
                )
                .join("") +
              "</div><small>Same serving, logged to its meal today.</small></div>";
          if ((D.savedMeals || []).length)
            h += "<div class=c><h3>Saved meals</h3>" + savedList() + "</div>";
          h +=
            "<div class=c><h3>Macros</h3><div class=metrics>" +
            [
              ["p", "Protein"],
              ["c", "Carbs"],
              ["f", "Fat"],
            ]
              .map(
                (a) =>
                  "<div><strong>" +
                  Math.round(mac[a[0]] * 10) / 10 +
                  "g</strong><small>" +
                  a[1] +
                  "</small></div>",
              )
              .join("") +
            "</div><p class=note>" +
            known +
            " of " +
            list.length +
            " entries have macros. Add label values in Custom; unrecorded macros are not counted.</p></div>";
          if (saveSource)
            h +=
              "<div class=c><h3>Save " +
              esc(saveSource) +
              '</h3><label for=smname>Meal name</label><input id=smname maxlength=60 value="Usual ' +
              esc(saveSource.toLowerCase()) +
              '"><small>All foods in this group are saved with their current servings and any macros.</small><div class=f><button onclick=saveMeal()>Save meal</button><button class=ch onclick="saveSource=\'\';R()">Cancel</button></div></div>';
          h +=
            '<h2>Meals <small style="font-size:13px">' +
            streak() +
            " day logging streak</small></h2><div class=c>";
          if (!list.length) h += "<small>Nothing logged yet. Tap Add.</small>";
          MEALS.forEach((m) => {
            var a = list.filter((x) => (x.meal || "Unsorted") === m);
            if (a.length) {
              h +=
                "<div class=mealhead><span>" +
                m +
                " · " +
                a.reduce((n, x) => n + x.k, 0) +
                ' kcal</span><button class="x star" onclick="startSave(\'' +
                m +
                "')\">Save meal</button></div>";
              a.forEach(
                (x) =>
                  (h +=
                    "<div class=r><span>" +
                    esc(x.n) +
                    "<br><small>" +
                    x.k +
                    ' kcal</small></span><button class=x onclick="del(' +
                    x.i +
                    ')">Delete</button></div>'),
              );
            }
          });
          h += "</div>";
        }
        if (P === 1) {
          h +=
            '<h2>Add food</h2><div class="addbar"><div class=f><button class="' +
            (!customMode && !savedMode && !barMode && !extraMode ? "active" : "") +
            '" onclick="foodMode(false)">Search foods</button><button class="' +
            (customMode ? "active" : "") +
            '" onclick="foodMode(true)">Custom food</button><button class="' +
            (savedMode ? "active" : "") +
            '" onclick="foodMode(false,true)">Saved meals</button><button class="' +
            (barMode ? "active" : "") +
            '" onclick="foodMode(false,false,true)">Barcode</button></div>';
          if (!customMode && !savedMode && !barMode && !extraMode)
            h +=
              '<label for=s>Search foods</label><input id=s type=search placeholder="Search Indian food" value="' +
              esc(Q) +
              '" oninput="sq(this.value)"><div class=f><button class="ch ' +
              (filter === "all" ? "active" : "") +
              '" data-filter=all onclick="setFilter(\'all\')">All foods</button><button class="ch ' +
              (filter === "fav" ? "active" : "") +
              '" data-filter=fav onclick="setFilter(\'fav\')">Favourites</button></div>';
          h +=
            '<div class=f><button class="ch" onclick="moreFood(\'usda\')">USDA live search</button></div></div><details class=c id=serving><summary>Serving settings · date, meal & list quantity</summary><div class=f><div><label for=date>Date (IST)</label><input id=date type=date value="' +
            now +
            '" max="' +
            now +
            '"></div><div><label for=meal>Meal</label><select id=meal>' +
            MEALS.slice(0, 4)
              .map((m) => "<option>" + m + "</option>")
              .join("") +
            "</select></div></div><label for=q>Quantity (list serving multiplier)</label><input id=q type=number inputmode=decimal value=1 min=0.1 step=0.1><small>Default: today · Breakfast · 1 serving. Custom calories and macros use the amounts you enter.</small></details>";
          h +=
            "<div class=c id=customform " +
            (!customMode ? "hidden" : "") +
            '><h3>Custom food</h3><label for=cn>Food name</label><input id=cn placeholder="Food name" maxlength=100><label for=ck>Calories for this serving</label><input id=ck type=number inputmode=numeric placeholder="Calories"><small>Optional macros for this serving (g)</small><div class=f>' +
            [
              ["mp", "Protein"],
              ["mc", "Carbs"],
              ["mf", "Fat"],
            ]
              .map(
                (a) =>
                  "<div><label for=" +
                  a[0] +
                  ">" +
                  a[1] +
                  "</label><input id=" +
                  a[0] +
                  ' type=number inputmode=decimal min=0 step=0.1 placeholder="g"></div>',
              )
              .join("") +
            "</div><button onclick=addC()>Add custom</button></div>";
          if (extraMode) h += extraPanel();
          if (barMode) {
            h +=
              '<div class=c><h3>Barcode</h3><p class=note>Scan a packaged food barcode or type its number. Open Food Facts fills Custom food for you to check; some products are not listed.</p><label for=bc>Barcode number</label><input id=bc inputmode=numeric maxlength=14 placeholder="Number under the barcode, e.g. 8901063012279"><div class=f><button onclick=lookupBarcode()>Look up</button><button id=scanbtn class=ch onclick=scanToggle()>Scan with camera</button></div><video id=cam hidden playsinline muted autoplay style="width:100%;max-height:300px;object-fit:contain;border-radius:10px;background:#000;margin-top:12px"></video><label class=note for=bcphoto style="display:block;margin-top:12px">Or scan a barcode photo</label><input id=bcphoto type=file accept="image/*" capture=environment onchange="scanPhoto(this)"><p class=note>Camera images stay on your device. Only the barcode number is sent for lookup. Review the food and serving size before adding.</p><p class=note id=bcmsg role=status aria-live=polite></p></div>';
          }
          if (savedMode)
            h +=
              "<div class=c><h3>Saved meals</h3><p class=note>One tap logs today in its saved meal group. Open Serving settings to change date, group or quantity.</p>" +
              savedList() +
              "</div>";
          if (!customMode && !savedMode && !barMode && !extraMode) {
            h += "<div class=c id=foodlist></div>";
            var recent = D.m
              .slice()
              .reverse()
              .filter((x, i, a) => a.findIndex((y) => y.n === x.n) === i)
              .slice(0, 5);
            if (recent.length)
              h +=
                "<details class=c><summary>Recent · add again</summary>" +
                recent
                  .map(
                    (x) =>
                      "<div class=r><span>" +
                      esc(x.n) +
                      "<br><small>" +
                      x.k +
                      ' kcal · same serving</small></span><button class="x star" onclick="repeat(' +
                      x.i +
                      ')">Add</button></div>',
                  )
                  .join("") +
                "</details>";
          }
          h +=
            "<p class=note>" +
            FOODS.length +
            ' foods available. Food calories are rough averages. Portions, oil and recipes vary. Open any food to review macros and grams before logging. Missing macros stay unknown. USDA search uses per-100g data. For accurate macros, use your pack label or recipe. Added recipe servings can be smaller than home or restaurant portions; adjust quantity. <a href="https://nnwa.in/foods/dishes/" target="_blank" rel="noopener">Added food estimates: NNWA dish tables</a> · <a href="https://world.openfoodfacts.org/" target="_blank" rel="noopener">Packaged snacks: pack label values via Open Food Facts</a>.</p>';
        }
        if (P === 2) {
          var dates = Array.from({ length: 7 }, (_, i) => days(i - 6)),
            vals = dates.map(tot),
            max = Math.max(D.g, ...vals),
            sum = vals.reduce((a, b) => a + b, 0);
          h +=
            "<h2>History</h2><div class=c><h3>Last 7 days</h3><small>" +
            sum +
            " kcal logged · " +
            Math.round(sum / 7) +
            " per calendar day</small><div class=chart>" +
            dates
              .map(
                (d, i) =>
                  "<div class=col><b>" +
                  vals[i] +
                  '</b><i style="height:' +
                  Math.round((vals[i] / max) * 100) +
                  'px"></i><small>' +
                  d.slice(5) +
                  "</small></div>",
              )
              .join("") +
            "</div><p class=note>Blank days count as 0 logged calories, not 0 eaten.</p></div><div class=c>";
          var ds = [...new Set(D.m.map((x) => x.d))].sort().reverse();
          if (!ds.length) h += "<small>No history yet.</small>";
          ds.forEach((d) => {
            h +=
              "<details><summary class=r>" +
              d +
              " · " +
              tot(d) +
              " kcal</summary>";
            D.m
              .filter((x) => x.d === d)
              .forEach(
                (x) =>
                  (h +=
                    "<div class=r><span>" +
                    esc(x.n) +
                    "<br><small>" +
                    (x.meal || "Unsorted") +
                    " · " +
                    x.k +
                    ' kcal</small></span><button class=x onclick="del(' +
                    x.i +
                    ')">Delete</button></div>'),
              );
            h += "</details>";
          });
          h += "</div>";
        }
        if (P === 3) {
          h +=
            "<h2>More</h2><div class=c><h3>Your goals</h3><button onclick=setG()>Calorie goal · " +
            D.g +
            " kcal</button><button onclick=setPG()>Protein goal · " +
            (D.pg || 60) +
            " g</button><button class=ch onclick=tg()>" +
            (T === "dark" ? "Light" : "Dark") +
            ' mode</button><p class=note>Goals are editable logging targets, not medical recommendations.</p></div><div class=c><h3>Keep your data safe</h3><button onclick=download()>Download backup</button><button onclick=bk()>Backup (copy)</button><button onclick=rs()>Restore from text</button><label for=restore>Or restore a backup file</label><input id=restore type=file accept=".json,application/json" onchange="restoreFile(this)"><p class=note>Stored only on this browser, not synced. Back up before clearing site data or changing phones. Old backups still work.</p></div><div class=c><h3>About</h3><p class=note>Calories v2.4 · Dates use India Standard Time. Food values are estimates. Macros count only values you enter. This is a personal log, not diet or medical advice.</p></div>';
        }
        document.getElementById("app").innerHTML = h;
        if (P === 1) renderFood();
      }
      function download() {
        var b = new Blob([JSON.stringify(D, null, 2)], {
            type: "application/json",
          }),
          url = URL.createObjectURL(b),
          a = document.createElement("a");
        a.href = url;
        a.download = "calories-" + today() + ".json";
        a.click();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      }
      function bk() {
        var s = JSON.stringify(D);
        if (navigator.clipboard)
          navigator.clipboard.writeText(s).then(
            () => notify("Backup copied"),
            () => prompt("Copy backup", s),
          );
        else prompt("Copy backup", s);
      }
      function restore(s) {
        try {
          var j = JSON.parse(s);
          if (!ok(j)) throw 1;
          j = withoutWeight(j);
          if (
            !confirm(
              "Replace all current food, favourites and saved meals with this backup?",
            )
          )
            return;
          try {
            localStorage.setItem("cal", JSON.stringify(j));
          } catch (e) {
            alert("Could not save backup. Current data was not changed.");
            return;
          }
          D = j;
          lastSaved = JSON.stringify(j);
          loadFailed = false;
          R();
          notify("Backup restored");
        } catch (e) {
          alert("Invalid backup. Current data was not changed.");
        }
      }
      function rs() {
        var s = prompt("Paste backup");
        if (s) restore(s);
      }
      function restoreFile(el) {
        var f = el.files[0];
        if (!f) return;
        if (f.size > 5000000) {
          alert("Backup too large (max 5 MB)");
          return;
        }
        var r = new FileReader();
        r.onload = () => restore(r.result);
        r.onerror = () => alert("Could not read backup");
        r.readAsText(f);
      }
      R();
    </script>
  </body>
</html>
